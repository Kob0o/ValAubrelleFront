name: Build & deploy dev

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-dev-front-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: registery-aubrelle.hiappy.fr
  IMAGE: registery-aubrelle.hiappy.fr/aubrelle-front
  INFRA_REPO: TitouanSaint-Chamarand/infra-ynov
  OVERLAY: apps/aubrelle/overlays/dev/kustomization.yaml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  build-push:
    needs: check
    # Only deploy from develop (PRs only run lint + tests)
    if: github.event_name !=
    runs-on: [self-hosted, linux]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checko

      - id: meta
        run: echo "tag=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{
          cache: npm

      - run: npm ci

      - name: Build Next.js
        # NEXT_PUBLIC_* variables are inlined at build time, set them here
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # NEXT_PUBLIC_API_.hiappy.fr
        run: |
          npm run build
          test -f .next/standalone/server.js || { echo "Missing output: 'standalone' in
  next.config"; exit 1; }

- uses: docker/setup-buildx-action@v3

- uses: docker/login-a
  with:
    registry: ${{ env.REGISTRY }}
    username: ${{ secr
    password: ${{ secrets.REGISTRY_PASSWORD }}

- uses: docker/build-p
  with:
  # Local context: the image copies the .next/standalone build from the
  workspace
context: .
push: true
tags: |
  ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
  ${{ env.IMAGE }}

update-infra:
  needs: build-push
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.INFRA_REPO }}
        token: ${{ secrets.INFRA_REPO_TOKEN }}
        path: infra

    - name: Set image tag in dev overlay
      working-directory: i
      env:
        TAG: ${{ needs.build-push.outputs.tag }}
      run: |
        yq -e '.images[] | select(.name == strenv(IMAGE))' "$OVERLAY" > /dev/null
        yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)'
  "$OVERLAY"
  git diff

- name: Commit and pus
  working-directory: infra
  run: |
    git config user.name "github-actions[bot]"
    git config user.embot]@users.noreply.github.com"
    git add "$OVERLAY"
    git diff --cached --quiet && exit 0
    git commit -m "dep{{needs.build-push.outputs.tag }}"
    for i in 1 2 3; do
      git pull --rebas
      sleep 5
    done
    exit 1